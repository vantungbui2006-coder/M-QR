<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coffee Order — Theo dõi đơn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <a href="menu.html" style="color:var(--cream); text-decoration:none; font-size:20px;">←</a>
    <div class="brand" style="font-size:18px;">Đơn của tôi</div>
    <span class="table-tag"></span>
  </div>

  <div class="wrap" id="orders-wrap"></div>

  <div class="tabbar">
    <a href="menu.html" class="tab-menu"><span class="ic">☰</span>Menu</a>
    <a href="cart.html" class="tab-cart"><span class="ic">🛒</span>Giỏ hàng (<span class="js-cart-count">0</span>)</a>
    <a href="tracking.html" class="tab-track active"><span class="ic">📋</span>Đơn hàng</a>
  </div>

<script src="app.js"></script>
<script>
  if (!getTable()) { location.href = 'index.html'; }
  function stageIndex(status) { return ORDER_STAGES.indexOf(status); }

  function renderOrders() {
    const orders = myOrders();
    const wrap = document.getElementById('orders-wrap');

    if (!orders.length) {
      wrap.innerHTML = `
        <div class="empty-state">
          <div class="ic">📋</div>
          <p>Bạn chưa có đơn nào ở bàn này</p>
          <a href="menu.html" class="btn btn-primary" style="margin-top:14px; text-decoration:none; display:inline-flex;">Đặt món ngay</a>
        </div>`;
      return;
    }

    wrap.innerHTML = orders.map(o => {
      const idx = stageIndex(o.status);
      const stamps = ORDER_STAGES.map((label, i) => {
        const cls = i < idx ? 'done' : (i === idx ? 'current' : '');
        const icon = i < idx ? '✓' : (i + 1);
        const line = i < ORDER_STAGES.length - 1
          ? `<div class="stamp-line ${i < idx ? 'done' : ''}"></div>` : '';
        return `<div class="stamp ${cls}">${icon}</div>${line}`;
      }).join('');
      const labels = ORDER_STAGES.map(l => `<span>${l}</span>`).join('');
      const itemsLine = o.items.map(it => `${it.qty}× ${it.name}`).join(', ');

      return `
        <div class="ticket">
          <div class="head">
            <span class="code">#${o.id}</span>
            <span class="table">Bàn ${o.table}</span>
          </div>
          <div class="stamp-labels">${labels}</div>
          <div class="stamp-trail">${stamps}</div>
          <p style="font-size:13px; margin:10px 0 4px;">${itemsLine}</p>
          <div class="summary-row total" style="border:none; padding-top:4px;">
            <span>Tổng</span><span class="val">${money(o.total)}</span>
          </div>
        </div>`;
    }).join('');
  }

  window.onOrdersChanged = renderOrders;
  pollOrders(renderOrders, 2000);
</script>
</body>
</html>
